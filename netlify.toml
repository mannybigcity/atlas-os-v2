[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[functions."daily-content-studio"]
  schedule = "0 14 * * *"

[functions."overnight-engine"]
  schedule = "0 4 * * *"

# stripe-bookkeeping-nightly schedules itself at 08:15 UTC from its function
# config. It does nothing unless STRIPE_BOOKKEEPING_ENABLED=true.
# stripe-bookkeeping-sync-background is the first-sync backfill and is not scheduled.
